# Roda os testes automáticos a cada envio e a cada pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest pyflakes
      - name: Verificar o código (pyflakes)
        run: pyflakes *.py tests/
      - name: Rodar os testes
        run: python -m pytest -q
